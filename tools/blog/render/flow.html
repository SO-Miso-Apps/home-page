<!-- figure: flow -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="figure.css">
<style>
  .stages { display: grid; gap: 14px; }
  .stage { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--canvas-deep); }
  .stage.action { background: var(--surface); border-color: rgba(19, 143, 91, 0.35); }
  .stage .step { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle); }
  .stage .what { font-weight: 600; font-size: 17px; margin-top: 6px; }
  .stage .who { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .linkdown { width: 1px; height: 18px; background: var(--line-strong); margin-left: 26px; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="frame">
  <div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">{{headline}}</h1>
    <div class="rule"></div>
    <div class="note">{{note}}</div>
  </div>
  <div class="stages">
    {{#rows}}<div class="stage"><div class="step">{{label}}</div><div class="what">{{value}}</div></div>{{/rows}}
  </div>
</div>
</body>
</html>
