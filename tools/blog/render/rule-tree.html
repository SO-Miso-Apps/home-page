<!-- figure: rule-tree -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="figure.css">
<style>
  .tree { display: grid; gap: 10px; }
  .cond {
    border: 1px solid var(--line);
    border-left: 2px solid var(--line-strong);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: baseline;
    background: var(--canvas-deep);
    font-size: 15px;
  }
  .cond .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); }
  .cond .v { font-weight: 600; }
  .then { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .then .arrow { width: 1px; height: 26px; background: var(--line-strong); }
  .chip {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-ink);
    border: 1px solid rgba(19, 143, 91, 0.35);
    border-radius: 999px;
    padding: 6px 12px;
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="frame">
  <div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">{{headline}}</h1>
    <div class="rule"></div>
    <div class="note">{{note}}</div>
  </div>
  <div class="panel">
    <div class="panel-title">When this is true</div>
    <div class="tree">
      {{#rows}}<div class="cond"><span class="k">{{label}}</span><span class="v">{{value}}</span></div>{{/rows}}
    </div>
    <div class="then"><span class="arrow"></span><span class="chip">then tag the product</span></div>
  </div>
</div>
</body>
</html>
